# ============================================================================
#  oci-w 部署编排（Docker）
# ----------------------------------------------------------------------------
#  镜像由本仓库源码在本地构建，不依赖任何外部镜像仓库。
#
#  用法：
#    docker compose up -d --build      # 构建并启动
#    docker compose logs -f oci-w      # 查看日志
#    docker compose down               # 停止
#
#  首次使用前请先准备好：
#    1) application.yml  —— 务必修改 web.account / web.password
#    2) oci-w.db         —— 初始数据库（仓库内已附带）
#    3) keys/            —— OCI API 私钥目录（空目录即可，之后放 pem）
# ============================================================================

services:
  oci-w:
    build:
      context: .
      dockerfile: Dockerfile
    image: oci-w:local
    container_name: oci-w
    restart: always
    # 注入一个极小的 init 进程，负责回收僵尸进程并转发停止信号，
    # 让 docker stop 时容器能干净退出（而不是等超时后被杀）。
    init: true
    ports:
      # 直接用 IP+端口访问时保持 8818；若配置 Nginx+HTTPS，
      # 建议改为 "127.0.0.1:8818:8818" 只监听本机，避免绕过 HTTPS。
      - "8818:8818"
    volumes:
      - ./application.yml:/app/oci-w/application.yml
      - ./oci-w.db:/app/oci-w/oci-w.db
      - ./keys:/app/oci-w/keys
      - ./logs:/var/log
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # VNC / Cloud Shell 救砖用的 websocket 代理。
  # 该组件以预构建镜像形式单独分发，使用前先导入：
  #     docker load -i oci-w-websockify.tar.gz
  # pull_policy: never 表示永不联网拉取，只使用本地已导入的镜像。
  #
  # 用不到 VNC 救砖功能时，可以把下面整段注释掉，不影响面板主体功能。
  # --------------------------------------------------------------------------
  websockify:
    image: oci-w-websockify:local
    pull_policy: never
    container_name: websockify
    restart: always
    ports:
      - "127.0.0.1:6080:6080"
    depends_on:
      - oci-w
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
