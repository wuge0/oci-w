# ============================================================================
#  可选：推送到 GitHub Container Registry (ghcr.io) 的 CI 工作流
# ----------------------------------------------------------------------------
#  用来把本地构建的镜像推送到 GitHub Container Registry（可选功能）。
#
#  镜像名使用 ${{ github.repository }}，会自动指向**你自己的仓库**，
#  无需修改任何硬编码名称；认证走内置 GITHUB_TOKEN，也不需要额外配 Secrets。
#
#  纯本地使用**不需要**这个工作流，可以忽略或直接删除本文件。
# ============================================================================
name: Docker Image CI (GHCR)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'img/**'
      - 'deploy/**'
      - '**/*.md'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'img/**'
      - 'deploy/**'
      - '**/*.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
